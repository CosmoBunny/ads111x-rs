[package]
name = "ads111x-rs"
version = "0.2.0"
edition = "2024"
description = "ADS1113/4/5 module/IC rust library. Use for reading ADC value (Analog to Digital Converter)."
license = "MIT"
repository = "https://github.com/CosmoBunny/ads111x-rs"
keywords = [
  "ADC",
  "ads1113",
  "ads1114",
  "ads1115",
  "embedded-hal",
]

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
embassy-time = { version = "0.4", optional = true }

[features]
async = ["dep:embedded-hal-async"]
embassy = ["async", "dep:embassy-time"]
default = []
